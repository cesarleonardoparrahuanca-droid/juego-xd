<script>

 for(let i=0;i<n;i++)for(let j=0;j<n;j++){const dx=(i+.5)*q-n*q/2,dy=(j+.5)*q-n*q/2,a=Math.atan2(dy,dx),k=sh[Math.floor((a+3.1416)/6.2832*12)%12],d=Math.hypot(dx,dy);

function bigBoom(B){G.fl=14;G.sk=16;['#ff783c','#ffc61a','#e0143c','#fff'].forEach(c=>boom(B.x,B.y,c,45));

 for(let y=0;y<h;y++){const t=y/h,a=t<.7?t/.7:(t-.7)/.3,c=t<.7?[11+19*a,10*a,48+62*a]:[30-22*a,10+100*a,110+40*a];g.fillStyle=`rgb(${c.map(Math.round)})`;g.fillRect(0,y,w,1)}
 g.globalAlpha=.55;for(let i=0;i<650;i++){const t=R(),px=95-55*t+rr(-11,11),py=20+58*t+rr(-11,11);g.fillStyle=R()<.5?'#3a46e0':'#6a3ae0';g.fillRect(px|0,py|0,1,1)}g.globalAlpha=1;
 disc(g,72,42,17,(i,j)=>i*.6+j*.8>6?'#2a8ad8':'#2ee6a0');g.fillStyle='#1fb98a';for(let k=0;k<6;k++)g.fillRect(64+Math.floor(R()*12),34+Math.floor(R()*12),2,2);
 disc(g,18,138,8,(i,j)=>j%3==0?'#8a40d0':'#b060f0');disc(g,30,22,4,()=>'#2a6fe0');disc(g,88,26,3,()=>'#2a6fe0');disc(g,76,Math.round(h*.68),6,(i,j)=>i+j>3?'#a02840':'#e04858');
 const sc=['#fff','#8ff','#c8f','#4af','#4f8'];for(let i=0;i<h*1.2;i++){g.fillStyle=sc[Math.floor(R()*5)];g.fillRect(Math.floor(R()*w),Math.floor(R()*h),1,1)}
 g.fillStyle='#bff';[[12,15],[55,70],[40,125],[90,150]].forEach(([a,b])=>{g.fillRect(a-2,b,5,1);g.fillRect(a,b-2,1,5)});return cv})();
function scroll(){if(G.sk>0)G.sk--;if(G.bn&&G.bn[2]>0)G.bn[2]--;G.fx.forEach(f=>f[2]++);G.fx=G.fx.filter(f=>f[2]<f[3]);stars.forEach(s=>{s[1]+=s[2];if(s[1]>H){s[1]=0;s[0]=R()*W}})}

let ac,mute=false,step=0;
function au(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state=='suspended')ac.resume()}
function tone(f,d,type,v,f2,t0){if(mute||!ac)return;const t=ac.currentTime+(t0||0),o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}
function noise(d,v){if(mute||!ac)return;const n=ac.sampleRate*d|0,bf=ac.createBuffer(1,n,ac.sampleRate),a=bf.getChannelData(0);for(let i=0;i<n;i++)a[i]=(R()*2-1)*(1-i/n);const s=ac.createBufferSource(),g=ac.createGain();s.buffer=bf;g.gain.value=v;s.connect(g);g.connect(ac.destination);s.start()}
const SFX={click:()=>tone(660,.06,'square',.06),coin:()=>tone(1318,.06,'square',.035),tick:()=>tone(300,.05,'square',.05,150),eshot:()=>tone(200,.1,'sawtooth',.03,120),shoot:()=>tone(900,.07,'square',.025,350),boom:()=>noise(.25,.12),hit:()=>{tone(220,.3,'sawtooth',.12,60);noise(.3,.12)},
 pow:()=>[523,784,1047].forEach((f,i)=>tone(f,.1,'square',.07,0,i*.09)),bomb:()=>{noise(.8,.25);tone(120,.7,'sawtooth',.14,30)},
 alarm:()=>{for(let i=0;i<4;i++)tone(i%2?330:220,.15,'square',.08,0,i*.18)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.15,'square',.08,0,i*.12)),over:()=>[392,330,262,196].forEach((f,i)=>tone(f,.25,'triangle',.1,0,i*.22))};
function sfx(n){SFX[n]&&SFX[n]()}
function toggleMute(){mute=!mute;mb.textContent=mute?'🔇':'🔊';au();sfx('click')}
setInterval(()=>{if(!ac||mute||(mode!='play'&&mode!='menu'))return;const bs=mode=='play'&&G.boss,sc=[0,3,7,10,12,10,7,3],b=bs?82.4:110;
 tone(b*2**(sc[step%8]/12),.16,bs?'sawtooth':'triangle',.05);if(step%2==0)tone(b/2,.2,'square',.035);if(bs&&step%4==2)noise(.05,.05);step++},170);
addEventListener('pointerdown',au);

function pc(px,py,r,f,q){q=q||3;x.fillStyle=f;for(let i=-r;i<=r;i+=q)for(let j=-r;j<=r;j+=q)if(i*i+j*j<=r*r)x.fillRect(Math.round(px+i-q/2),Math.round(py+j-q/2),q,q)}
function txt(t,px,py,sz,col,al){x.font='bold '+sz+'px "Courier New",monospace';x.textAlign=al||'left';x.fillStyle='#000';x.fillText(t,px+2,py+2);x.fillStyle=col;x.fillText(t,px,py)}

function draw0(){
 x.filter='hue-rotate('+HUE[G.bl%5]+'deg)';x.drawImage(BG,0,0,W,H);x.filter='none';
 stars.forEach(s=>{const v=Math.floor(80+s[2]*70);x.fillStyle=`rgb(${v},${v},255)`;x.fillRect(s[0]|0,s[1]|0,s[2]<1.5?2:4,s[2]<1.5?2:4)});
 G.m.forEach(m=>{if(m.type=='fast'){x.fillStyle='rgba(120,220,255,.35)';x.fillRect(m.x-4,m.y-m.r-44,8,44);x.fillStyle='rgba(210,248,255,.7)';x.fillRect(m.x-2,m.y-m.r-26,4,26)}x.drawImage(m.hf>0?sil(m.img):m.img,Math.round(m.x-m.img.width/2),Math.round(m.y-m.img.height/2));if(m.hp<m.mhp){x.fillStyle='#300';x.fillRect(m.x-12,m.y-m.r-8,24,4);x.fillStyle='#ff5a3c';x.fillRect(m.x-12,m.y-m.r-8,24*m.hp/m.mhp,4)}});
 G.p.forEach(p=>{const[l,col]=PW[p[2]];pc(p[0],p[1],17,'#fff');pc(p[0],p[1],13,col);txt(l,p[0],p[1]+6,18,'#000','center')});
 const B=G.boss;
 G.wn.forEach(w=>{if(Math.floor(w[1]/5)%2==0)txt('!',w[0],100,30,'#ff4646','center')});
 if(B){const ox=B.dy?Math.round(rr(-4,4)):0;x.drawImage(B.hf>0||(B.dy&&B.dy%6<3)?BSW[B.ty]:BS[B.ty],Math.round(B.x-80)+ox,Math.round(B.y-35),160,70);
  x.fillStyle='#3c1414';x.fillRect(50,58,300,10);x.fillStyle='#e63246';x.fillRect(50,58,300*Math.max(0,B.hp/B.max),10);
  x.strokeStyle='#fff';x.lineWidth=2;x.strokeRect(50,58,300,10);txt(B.name,200,50,14,'#fff','center')}
 G.b.forEach(b=>{if(b[4]){pc(b[0],b[1],8,'#ff6a1a',3);pc(b[0],b[1],4,'#ffe6a0',2);return}x.fillStyle=SKINS[skin].bc;x.fillRect(b[0]-2,b[1]-9,4,12);x.fillStyle='#fff';x.fillRect(b[0]-2,b[1]-9,4,4)});
 G.eb.forEach(b=>{pc(b[0],b[1],7,'#e0143c',2);pc(b[0],b[1],3,'#ffdcdc',2)});
 G.fx.forEach(f=>{if(f[2]<0)return;const t=f[2]/f[3],r=f[4]*(.3+t*1.4);x.globalAlpha=1-t;x.fillStyle=f[5];for(let a=0;a<20;a++)x.fillRect(Math.round(f[0]+Math.cos(a*.314)*r)-2,Math.round(f[1]+Math.sin(a*.314)*r)-2,4,4);x.globalAlpha=1});
 G.pt.forEach(p=>{x.fillStyle=p[5];const z=Math.max(2,Math.round(p[4]/8));x.fillRect(p[0]|0,p[1]|0,z,z)});
 if(mode!='over'&&!(G.inv>0&&Math.floor(G.inv/5)%2==0)){const X=Math.round(G.px),Y=Math.round(G.py),f=2+Math.floor(R()*3);
  for(let i=0;i<f+2;i++){const w=Math.max(1,4-Math.floor(i*1.2));const F=SKINS[skin].fl;x.fillStyle=i<2?F[0]:i<4?F[1]:F[2];x.fillRect(X-w*3,Y+21+i*3,w*6,3)}
  x.drawImage(SKINS[skin].cv,X-24,Y-30,48,51);
  if(G.sh>0&&(G.sh>120||Math.floor(G.sh/6)%2)){x.fillStyle='#3ca0ff';for(let a=0;a<24;a++)x.fillRect(Math.round(X+Math.cos(a*.2618)*36)-3,Math.round(Y+Math.sin(a*.2618)*36)-3,6,6)}}
 if(G.god&&mode!='over'){const T=Date.now();x.fillStyle='#ffd84a';for(let a=0;a<16;a++)x.fillRect(Math.round(G.px+Math.cos(a*.3927+T/400)*34)-3,Math.round(G.py+Math.sin(a*.3927+T/400)*34)-3,5,5);txt('MODO DIOS',W/2,H-12,14,'#ffd84a','center')}
 txt('PUNTOS '+G.score,10,26,18,'#fff');txt('NIVEL '+(G.bl+1),W/2+15,26,15,'#ffd84a','center');if(!G.boss){x.fillStyle='#222';x.fillRect(W/2-45,34,120,6);x.fillStyle='#ffd84a';x.fillRect(W/2-45,34,120*Math.max(0,Math.min(1,(G.score-G.ls)/(G.bossAt-G.ls))),6)}for(let i=0;i<G.lives;i++)x.drawImage(HEART,10+i*32,36,27,24);
 pc(18,76,7,'#ffc61a',2);txt(wallet,32,82,16,'#ffd84a');let yy=100;[['ESCUDO',G.sh,480,'#3ca0ff'],['TRIPLE',G.tr,600,'#ffdc3c'],skin==3?['FASE',G.pc,900,'#a0e0ff']:['',0,1,'']].forEach(([n,v,m,col])=>{if(v>0){txt(n,10,yy+10,12,col);x.fillStyle=col;x.fillRect(80,yy,80*v/m,8);yy+=18}});
 if(G.bn&&G.bn[2]>0){x.globalAlpha=Math.min(1,G.bn[2]/30);txt(G.bn[0],W/2,H/2-60,32,'#ffd84a','center');txt(G.bn[1],W/2,H/2-25,16,'#fff','center');x.globalAlpha=1}
 if(G.mt>0)txt(G.msg,200,H/2-100,22,'#fff078','center');
 if(G.fl>0){x.fillStyle=`rgba(255,255,255,${Math.min(.6,G.fl*.07)})`;x.fillRect(0,0,W,H)}
}

function draw(){x.save();if(G.sk>0)x.translate(Math.round(rr(-G.sk,G.sk)),Math.round(rr(-G.sk,G.sk)));draw0();x.restore()}
function show(h){ov.innerHTML=h;ov.style.display='flex'}
function hide(){ov.style.display='none'}
function menu(){mode='menu';reset();pb.style.display='none';
 show(`<h1>COHETE vs<br>METEORITOS</h1><p>Récord: ${best} · Monedas: ${wallet}${pend?' · ⚡ CÓDIGO LISTO':''}</p><button class="b" onclick="play()">▶ JUGAR (NIVEL ${selLv})</button><button class="b g" onclick="levels()">NIVELES</button><button class="b g" onclick="shop()">TIENDA</button><button class="b g" onclick="codes()">CÓDIGOS</button><button class="b g" onclick="help()">CÓMO JUGAR</button>`)}
function shop(){sfx('click');pb.style.display='none';show(`<h1>TIENDA</h1><p>Monedas: ${wallet}</p><div id="shl">${SKINS.map((k,i)=>{const o=owned.includes(i),e=skin==i;return `<div class="sk"><img src="${k.cv.toDataURL()}"><div class="ab"><b>${k.n}</b>${k.ab}</div><button ${e?'disabled':''} style="background:${e?'#555':o?'#2a6fb0':wallet>=k.p?'#2a8a3a':'#7a2a2a'}" onclick="buy(${i})">${e?'EN USO':o?'EQUIPAR':k.p+' monedas'}</button></div>`}).join('')}</div><button class="b g" onclick="menu()">VOLVER</button>`)}
function buy(i){const k=SKINS[i];if(owned.includes(i)){skin=i;sv();sfx('click')}else if(wallet>=k.p){wallet-=k.p;owned.push(i);skin=i;sv();sfx('pow')}else sfx('hit');shop()}
function levels(){sfx('click');show(`<h1>NIVELES</h1><p>Vence al jefe para desbloquear el siguiente</p><div id="lvg">${Array.from({length:12},(_,i)=>{const n=i+1,ok=n<=maxLv;return `<button class="lvb" ${ok?'':'disabled'} onclick="selLv=${n};play()">${ok?n:'🔒'}</button>`}).join('')}</div><button class="b g" onclick="menu()">VOLVER</button>`)}
const CODES={mallon:()=>{pend=true;sv();return'¡CÓDIGO ACTIVADO! Tu próxima partida tendrá VIDA INFINITA y DAÑO INFINITO'}};
function codes(){sfx('click');show(`<h1>CÓDIGOS</h1><p>Escribe un código secreto</p><input id="cin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="código..."><button class="b" onclick="redeem()">CANJEAR</button><p id="cmsg" style="color:#7aff7a;min-height:44px;max-width:260px">${pend?'Tienes un código activo para tu próxima partida':''}</p><button class="b g" onclick="menu()">VOLVER</button>`)}
function redeem(){let v=document.getElementById('cin').value.trim().toLowerCase().replace(/\s+/g,'');if(v=='mallonesa')v='mallon';const f=CODES[v],m=document.getElementById('cmsg');
 if(f){m.textContent=f();m.style.color='#7aff7a';sfx('win')}else{m.textContent='Código inválido';m.style.color='#ff6a6a';sfx('hit')}}
const JD=['Equilibrada. Dispara abanicos, ráfagas dirigidas a ti y círculos de balas.','Muy veloz. Lanza cortinas de balas con un hueco, ráfagas apuntadas y embestidas laterales.','Flota lanzando espirales giratorias. En fases avanzadas suelta anillos de balas.','Muros de balas con hueco, abanicos y picadas en tu dirección desde la fase 2.'];
function pu(l,c){const k=document.createElement('canvas');k.width=k.height=36;const g=k.getContext('2d');g.fillStyle='#fff';g.beginPath();g.arc(18,18,17,0,6.28);g.fill();g.fillStyle=c;g.beginPath();g.arc(18,18,13,0,6.28);g.fill();g.fillStyle='#000';g.font='bold 18px "Courier New"';g.textAlign='center';g.fillText(l,18,25);return k.toDataURL()}
function encData(t){
 if(t==0)return[[0,'Controles','Desliza el dedo por la pantalla para mover la nave. Dispara sola.'],[0,'Pausa','Botón ⏸ arriba a la derecha: continuar, reiniciar o volver al menú.'],[0,'Niveles','Vence al jefe para pasar de nivel. Ganas una vida (máx. 5) y el siguiente jefe es más duro.'],[0,'Monedas','Se ganan destruyendo meteoritos y jefes. Úsalas en la TIENDA para comprar naves con habilidades.'],[0,'Códigos','Escribe códigos secretos en CÓDIGOS para activar sorpresas.']];
 if(t==1)return[[pu('S','#3ca0ff'),'Escudo','Absorbe un golpe. Dura 8 segundos.'],[pu('T','#ffdc3c'),'Disparo triple','Tres balas en abanico durante 10 segundos.'],[pu('B','#ff4646'),'Bomba','Destruye todos los meteoritos y balas enemigas y le quita vida al jefe.']];
 if(t==2)return[[rock(18,'normal').toDataURL(),'Meteorito normal','Cae recto. Aguanta de 1 a 3 golpes según su tamaño.'],[rock(24,'silver').toDataURL(),'Plateado','Grande y lento. Aguanta 8 golpes. Da 100 puntos y 8 monedas.'],[rock(20,'red').toDataURL(),'Rojo','Al romperse se divide en 3 meteoritos pequeños.'],[rock(14,'fast').toDataURL(),'Celeste rápido','Cae a toda velocidad. Un "!" rojo avisa dónde va a aparecer.']];
 if(t==3)return BN.map((n,i)=>[BS[i].toDataURL(),n,JD[i],1]).concat([[0,'Fases','Todos los jefes tienen 3 fases: al bajar al 66% y al 33% de vida se vuelven más rápidos y agresivos. Al caer sueltan monedas y un power-up.']]);
 return SKINS.map(k=>[k.cv.toDataURL(),k.n+(k.p?' · '+k.p+' monedas':''),k.ab])}
function help(t){t=t||0;sfx('click');show(`<h1>ENCICLOPEDIA</h1><div id="tbs">${['BÁSICO','BOOSTS','METEORITOS','JEFES','NAVES'].map((n,i)=>`<button class="tb${i==t?' on':''}" onclick="help(${i})">${n}</button>`).join('')}</div><div id="shl">${encData(t).map(([im,n,d,c])=>`<div class="en">${im?`<img${c?' class="w"':''} src="${im}">`:''}<div><b>${n}</b>${d}</div></div>`).join('')}</div><button class="b g" onclick="menu()">VOLVER</button>`)}
function play(){au();sfx('click');reset();G.god=pend;if(pend){pend=false;sv();say('MODO DIOS: VIDA Y DAÑO INFINITOS')}G.bl=selLv-1;G.bossAt=500+150*G.bl;banner('NIVEL '+selLv,LN[G.bl%5]);mode='play';acc=0;hide();pb.style.display='block'}
function pauseGame(){if(mode!='play')return;mode='pause';
 show(`<h1>PAUSA</h1><button class="b" onclick="resume()">Continuar</button><button class="b g" onclick="play()">Reiniciar</button><button class="b g" onclick="menu()">Menú</button>`)}
function resume(){mode='play';acc=0;hide()}

let lx=0,ly=0,drag=false;
c.addEventListener('pointerdown',e=>{lx=e.clientX;ly=e.clientY;drag=true;c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(drag&&mode=='play'){G.px+=(e.clientX-lx)/S*1.3;G.py+=(e.clientY-ly)/S*1.3;lx=e.clientX;ly=e.clientY}});
c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);
addEventListener('keydown',e=>{K[e.key]=1;if(e.key=='p'||e.key=='Escape')mode=='pause'?resume():pauseGame()});
addEventListener('keyup',e=>K[e.key]=0);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});

let last=0,acc=0;
function loop(t){requestAnimationFrame(loop);const d=Math.min(t-last,100);last=t;
 if(mode=='play'){acc+=d;while(acc>=16.667&&mode=='play'){update();acc-=16.667}}
 {const sh=(mode=='play'||mode=='pause')?'block':'none';if(mb.style.display!=sh)mb.style.display=sh}if(mode=='menu'){scroll();G.px=200+Math.sin(t/600)*80}if(G)draw()}
reset();menu();requestAnimationFrame(loop);
</script>
